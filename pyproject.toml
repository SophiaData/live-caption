[project]
name = "live-caption"
version = "0.1.0"
description = "实时双语字幕：把电脑正在播放的声音实时变成原文+译文悬浮字幕"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
