name: pr-check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    strategy:
      matrix:
        os:
          - macos-14
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 建虚拟环境并装依赖（与 build-release 一致）
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install PySide6 sounddevice httpx numpy \
            pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-Quartz \
            pyobjc-framework-ScreenCaptureKit pyobjc-framework-AVFoundation \
            pyobjc-framework-CoreAudio pyobjc-framework-CoreMedia \
            mypy ruff pytest pytest-qt pytest-mock

      - name: 跑质量门
        run: make check

      - name: 跑质量门
        run: make check
