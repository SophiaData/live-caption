name: pr-check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    strategy:
      matrix:
        os:
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 架构断言（轻量：解释器必须是 arm64，Issue #20）
        # 不打包也能挡住「runner 换成 Intel 之后静默产出跑不动的包」。
        # 非 macOS 平台会打印「跳过」，不会因此变红。
        run: make check-arch PYTHON=python

      - name: 建虚拟环境并装依赖（与 build-release 一致）
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: 跑质量门
        run: make check
