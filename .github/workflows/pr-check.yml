name: pr-check

on:
  pull_request:
    branches:
      - master

jobs:
  check:
    strategy:
      matrix:
        os:
          - macos-14
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装项目与开发依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install PySide6 sounddevice httpx numpy mypy ruff pytest pytest-qt pytest-mock

      - name: 安装 macOS 依赖
        if: runner.os == 'macOS'
        run: |
          python -m pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-Quartz \
            pyobjc-framework-ScreenCaptureKit pyobjc-framework-AVFoundation \
            pyobjc-framework-CoreAudio pyobjc-framework-CoreMedia

      - name: 跑质量门
        run: make check
